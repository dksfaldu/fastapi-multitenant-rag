<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenaxRAG - TalkToDoc</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #151b2b;
            --surface-hover: #1e263d;
            --border-color: #2a3441;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --user-bubble: #6366f1;
            --ai-bubble: #1e293b;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Auth Overlay --- */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-card {
            background: var(--surface-color);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 24px;
            font-size: 1.75rem;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: var(--surface-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* --- Sidebar Projects --- */
        #sidebar {
            width: 320px;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .projects-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .project-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-weight: 500;
            border: 1px solid transparent;
        }

        .project-item:hover {
            background: var(--surface-hover);
            color: white;
        }

        .project-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #818cf8;
        }

        .create-project-btn {
            margin: 16px 24px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.2s;
        }

        .create-project-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--text-secondary);
        }

        .user-profile {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* --- Main Chat Interface --- */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            position: relative;
        }

        /* --- Document Panel --- */
        #doc-panel {
            background: rgba(21, 27, 43, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: none;
            /* hidden when no project is selected */
            justify-content: space-between;
            align-items: center;
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
        }

        .project-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 4px;
        }

        .doc-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-upload {
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-upload:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .btn-delete {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger-color);
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* --- Chat Display --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .empty-chat {
            margin: auto;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-chat h2 {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .user .bubble {
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: white;
        }

        .ai .bubble {
            background-color: var(--ai-bubble);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .sources-list {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .source-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
        }

        /* --- Input Area --- */
        .chat-input-wrapper {
            padding: 24px 40px;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
        }

        .input-box {
            display: flex;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            align-items: center;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
            outline: none;
        }

        .input-box input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        /* Loading indicator */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 16px 20px;
            background: var(--ai-bubble);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Auth Injection via FastAPI Jinja Templates -->
    <script>
        const AUTH_STATE = "{{ USER_AUTH_STATE }}" === "true";
        const USERNAME = "{{USERNAME}}";
        const IS_ADMIN = "{{ IS_ADMIN }}" === "true";
    </script>

    <!-- Interface (Always Active) -->
    <div id="app-wrapper" style="display: flex; width: 100%; height: 100%;">
        <div id="sidebar">
            <div class="sidebar-header">
                <h3>Projects</h3>
                <span id="admin-badge"
                    style="display: none; font-size: 0.7rem; background: rgba(59,130,246,0.2); color: #60a5fa; padding: 4px 8px; border-radius: 8px;">ADMIN</span>
            </div>

            <div class="create-project-btn" onclick="createProject()">
                + Create New Project
            </div>

            <div class="projects-list" id="project-list">
                <!-- Injected via JS -->
            </div>

            <div class="user-profile">
                <div class="user-badge">
                    <div class="avatar" id="avatar-letter">U</div>
                    <span id="username-display" style="font-weight: 500;">User</span>
                </div>
                <form action="/auth/logout" method="POST" style="margin: 0;">
                    <button type="submit" class="btn btn-outline"
                        style="padding: 6px 12px; font-size: 0.85rem; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); cursor: pointer; border-radius: 6px;">Logout</button>
                </form>
            </div>
        </div>

        <div id="main-content">
            <!-- Header for Uploads -->
            <div id="doc-panel">
                <div class="project-title">
                    <span id="selected-project-name">Select a Project</span>
                    <span class="project-subtitle" id="selected-project-id">No Active Context</span>
                </div>

                <div class="doc-actions">
                    <div
                        style="display: flex; gap: 8px; align-items: center; border-right: 1px solid var(--border-color); padding-right: 16px;">
                        <input type="text" id="delete-doc-id" class="form-control"
                            style="width: 140px; padding: 6px 10px; font-size: 0.85rem;" placeholder="Ref. Document ID">
                        <button class="btn-delete" onclick="deleteDocument()">Purge</button>
                    </div>

                    <div class="file-upload-wrapper">
                        <button class="btn-upload">+ Upload PDF</button>
                        <input type="file" id="pdf-upload" accept="application/pdf" onchange="uploadDocument(event)">
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div id="chat-container">
                <div class="empty-chat" id="empty-state">
                    <h2>Knowledge Interface</h2>
                    <p>Select or create a project to start chatting with your indexed documents.</p>
                </div>
                <!-- Chat Bubbles -->
            </div>

            <div class="chat-input-wrapper">
                <form class="input-box" onsubmit="sendMessage(event)">
                    <input type="text" id="chat-input" placeholder="Ask anything about the uploaded documents..."
                        autocomplete="off">
                    <button type="submit" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentProjects = [];
        let activeProject = null;

        // Application Auto-Boot Sequence
        document.getElementById('username-display').textContent = USERNAME;
        if (USERNAME.length > 0) {
            document.getElementById('avatar-letter').textContent = USERNAME.charAt(0).toUpperCase();
        }

        if (IS_ADMIN) {
            document.getElementById('admin-badge').style.display = 'block';
            document.getElementById('admin-badge').style.cursor = 'pointer';
            document.getElementById('admin-badge').onclick = () => window.location.href = '/admin';
        }

        loadProjects();

        async function loadProjects() {
            try {
                const res = await fetch('/api/ui/projects');
                if (res.status === 401) { window.location.reload(); return; }
                const projects = await res.json();
                currentProjects = projects;
                renderProjects();
            } catch (err) {
                console.error("Failed fetching projects", err);
            }
        }

        function renderProjects() {
            const container = document.getElementById('project-list');
            container.innerHTML = '';

            currentProjects.forEach(proj => {
                const el = document.createElement('div');
                el.className = 'project-item' + (activeProject?.internal_id === proj.internal_id ? ' active' : '');
                el.textContent = proj.name;
                el.onclick = () => selectProject(proj);
                container.appendChild(el);
            });
        }

        async function createProject() {
            const name = prompt("Enter a name for the new Knowledge Base:");
            if (!name) return;

            const formData = new FormData();
            formData.append('name', name);

            const res = await fetch('/api/ui/projects', {
                method: 'POST',
                body: formData
            });
            const newProj = await res.json();
            currentProjects.push(newProj);
            renderProjects();
            selectProject(newProj);
        }

        function selectProject(proj) {
            activeProject = proj;
            renderProjects(); // Refresh active class

            document.getElementById('doc-panel').style.display = 'flex';
            document.getElementById('selected-project-name').textContent = proj.name;
            document.getElementById('selected-project-id').textContent = `ID: ${proj.internal_id}`;

            document.getElementById('chat-container').innerHTML = ''; // Clear chat history
        }

        async function uploadDocument(event) {
            if (!activeProject) {
                alert("Please select a project first.");
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            // For a friendly UI logic, generate a random Document ID string derived from the name
            const docId = file.name.replace(/[^a-zA-Z0-9_-]/g, '_') + "_" + Math.floor(Math.random() * 1000);

            appendSystemMessage(`Uploading and Indexing: ${file.name} (Doc ID: ${docId})...`);

            const formData = new FormData();
            formData.append('project_id', activeProject.internal_id);
            formData.append('document_id', docId);
            formData.append('file', file);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const json = await res.json();
                if (res.ok) {
                    appendSystemMessage(`✅ Successfully indexed ${file.name}. You can refer to it as ${docId}.`);
                } else {
                    appendSystemMessage(`❌ Upload Failed: ${json.detail}`);
                }
            } catch (err) {
                appendSystemMessage(`❌ Error during network transfer`);
            }

            // Reset input
            event.target.value = '';
        }

        async function deleteDocument() {
            if (!activeProject) return;

            const docId = document.getElementById('delete-doc-id').value.trim();
            if (!docId) {
                alert("Enter the Document ID to purge its vectors.");
                return;
            }

            if (!confirm(`Are you sure you want to permanently delete nodes mapping strictly to document '${docId}'?`)) return;

            appendSystemMessage(`Purging vector segments for ${docId}...`);

            try {
                // Endpoint expects JSON body
                const res = await fetch('/document', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: activeProject.internal_id,
                        document_id: docId
                    })
                });

                const json = await res.json();
                if (res.ok) {
                    appendSystemMessage(`🧹 Document vector nodes completely purged.`);
                    document.getElementById('delete-doc-id').value = '';
                } else {
                    appendSystemMessage(`❌ Purge Failed: ${json.detail}`);
                }
            } catch (e) {
                appendSystemMessage(`❌ Network error triggering deletion.`);
            }
        }

        async function sendMessage(e) {
            e.preventDefault();

            if (!activeProject) {
                alert("Please select a project before chatting.");
                return;
            }

            const inputEl = document.getElementById('chat-input');
            const message = inputEl.value.trim();
            if (!message) return;

            inputEl.value = '';

            // UI Update: add user bubble
            appendMessage(message, 'user');
            const typingIndicator = appendTypingIndicator();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: activeProject.internal_id,
                        message: message
                    })
                });

                typingIndicator.remove();

                if (!res.ok) {
                    const err = await res.json();
                    appendSystemMessage(`Chat Engine Error: ${err.detail}`);
                    return;
                }

                const data = await res.json();
                appendAISourceMessage(data.response, data.sources);

            } catch (err) {
                typingIndicator.remove();
                appendSystemMessage("Chat engine failed to connect.");
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(text, role) {
            const container = document.getElementById('chat-container');

            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            scrollToBottom();
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.style.margin = '10px auto';
            wrapper.style.fontSize = '0.85rem';
            wrapper.style.color = 'var(--text-secondary)';
            wrapper.style.textAlign = 'center';
            wrapper.style.background = 'rgba(255,255,255,0.02)';
            wrapper.style.padding = '6px 16px';
            wrapper.style.borderRadius = '20px';
            wrapper.textContent = text;

            container.appendChild(wrapper);
            scrollToBottom();
        }

        function appendAISourceMessage(text, sources) {
            const container = document.getElementById('chat-container');

            const wrapper = document.createElement('div');
            wrapper.className = 'message ai';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = text.replace(/\n/g, '<br>');
            wrapper.appendChild(bubble);

            if (sources && sources.length > 0) {
                const sourceContainer = document.createElement('div');
                sourceContainer.className = 'sources-list';

                // Track unique document IDs to avoid huge duplicate badge spam
                const uniqueDocIds = [...new Set(sources.map(s => s.document_id).filter(id => id !== "unknown"))];

                uniqueDocIds.forEach(docId => {
                    const tag = document.createElement('div');
                    tag.className = 'source-tag';
                    tag.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        style="margin-right: 4px;">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
    </svg> ID: ${docId}`;
                    sourceContainer.appendChild(tag);
                });
                if (uniqueDocIds.length > 0) {
                    wrapper.appendChild(sourceContainer);
                }
            }

            container.appendChild(wrapper);
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const container = document.getElementById('chat-container');
            const el = document.createElement('div');
            el.className = 'typing-indicator';
            el.innerHTML = `<div class="dot"></div>
                <div class="dot" ></div>
                    <div class="dot"></div>`;
            container.appendChild(el);
            scrollToBottom();
            return el;
        }

    </script>
</body>

</html>
