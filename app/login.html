<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TenaxRAG</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 10px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        #error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <h2>TenaxRAG Login</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem;">Sign in to access your secure
            knowledge bases.</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <input type="text" id="login-username" class="form-control" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 8px;">Login</button>
        </form>

        <div id="error-msg">Invalid username or password.</div>


    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('error-msg');

            const formData = new FormData();
            formData.append('username', u);
            formData.append('password', p);

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData,
                    redirect: 'follow'
                });

                if (res.ok) {
                    window.location.href = '/talktodoc';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = "Login communication failed.";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>

</html>
